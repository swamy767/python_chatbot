<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSIT ECE Chatbot</title>
    <!-- Add FontAwesome and external fonts -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Outfit', sans-serif;
            /* Premium dark mode gradient */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
        }

        /* Notes Search Interface embedded in Chat */
        .notes-search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.4);
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .notes-search-input::placeholder { color: #94a3b8; }
        .notes-search-input:focus { outline: none; border-color: #8b5cf6; }
        
        .subject-section {
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
        }
        .subject-section h4 {
            color: #c4b5fd;
            margin-bottom: 8px;
            font-size: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }
        .notes-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        .notes-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }
        .notes-list li::before {
            content: "📄";
            margin-right: 8px;
            font-size: 0.85rem;
        }
        .notes-list a {
            color: #f1f5f9;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .notes-list a:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        /* Layout Container */
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Main Chat Card with Glassmorphism */
        .chat-card {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            padding: 20px 25px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bot-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #8b5cf6;
            padding: 2px;
            background: #fff;
        }

        .bot-info h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .bot-info p {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Category Selector Area */
        .category-section {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '\f107';
            /* FontAwesome angle-down */
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b5cf6;
            pointer-events: none;
        }

        .category-select {
            width: 100%;
            appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-select:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.1);
        }

        .category-select option {
            background-color: #1e293b;
            color: #f8fafc;
        }

        /* Generated Sub-options */
        .sub-options-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 20px 5px;
            scrollbar-width: thin;
            scrollbar-color: rgba(139, 92, 246, 0.5) transparent;
        }

        .sub-options-container::-webkit-scrollbar {
            height: 6px;
        }

        .sub-options-container::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        .sub-option-btn {
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .sub-option-btn:hover {
            background: #8b5cf6;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        /* Chat Body */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        /* Messages */
        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
        }

        .message-wrapper.bot {
            align-self: flex-start;
        }

        .message-wrapper.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .message-wrapper.bot .message-bubble {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
            color: #f8fafc;
        }

        .message-wrapper.user .message-bubble {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-bottom-right-radius: 4px;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .msg-time {
            display: block;
            font-size: 0.7rem;
            margin-top: 6px;
            opacity: 0.6;
            text-align: right;
        }

        .message-wrapper.bot .msg-time {
            text-align: left;
        }

        /* Footer / Input Area */
        .chat-footer {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .type_msg {
            flex: 1;
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .type_msg:focus {
            outline: none;
        }

        .type_msg::placeholder {
            color: #64748b;
        }

        .action-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.4);
        }

        .action-btn.mic {
            background: rgba(255, 255, 255, 0.1);
            color: #a78bfa;
            box-shadow: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-btn.mic:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            margin-bottom: 10px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #a78bfa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40%           { transform: scale(1); }
        }

        /* ── Mobile Responsive ───────────────────────────────────────────── */
        @media (max-width: 640px) {
            body, html {
                height: 100%;
                overflow: hidden; /* prevent double scroll bars */
            }

            .app-container {
                padding: 0;          /* remove desktop padding */
                align-items: stretch;
                height: 100vh;
                height: 100dvh;      /* dynamic viewport on mobile browsers */
            }

            .chat-card {
                max-width: 100%;     /* full width */
                height: 100vh;
                height: 100dvh;      /* fills the whole screen */
                border-radius: 0;    /* no rounded corners on phone edge */
                border: none;
            }

            .chat-header {
                padding: 12px 15px;
            }

            .bot-avatar {
                width: 40px;
                height: 40px;
            }

            .bot-info h2 {
                font-size: 1rem;
            }

            .bot-info p {
                font-size: 0.75rem;
            }

            .category-section {
                padding: 10px 12px;
            }

            .sub-options-container {
                padding: 10px 12px 4px;
            }

            .chat-body {
                padding: 12px;
                gap: 10px;
            }

            .message-wrapper {
                max-width: 90%;
            }

            .message-bubble {
                font-size: 0.9rem;
                padding: 10px 13px;
            }

            .chat-footer {
                padding: 10px 12px;
            }

            .type_msg {
                font-size: 0.9rem;
                padding: 8px 10px;
            }

            .action-btn {
                width: 38px;
                height: 38px;
            }
        }
        /* ─── Add Notes Inline Panel ───────────────────────────────────────── */
        .add-notes-panel {
            display: none;
            padding: 12px 20px 14px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .add-notes-panel.open { display: block; }
        .anp-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .anp-row input, .anp-row select, .anp-row textarea {
            flex: 1;
            min-width: 120px;
            appearance: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            padding: 10px 14px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .anp-row input:focus, .anp-row select:focus, .anp-row textarea:focus {
            outline: none;
            border-color: #8b5cf6;
        }
        .anp-row input::placeholder, .anp-row textarea::placeholder { color: #64748b; }
        .anp-row select option { background: #1e293b; }
        .anp-row textarea { resize: none; height: 62px; }
        .anp-footer { display: flex; gap: 8px; align-items: center; }
        .anp-submit {
            appearance: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            padding: 10px 18px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .anp-submit:hover { background: rgba(139,92,246,0.2); }
        .anp-msg { font-size: 0.82rem; }
        .anp-msg.ok  { color: #10b981; }
        .anp-msg.err { color: #ef4444; }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="chat-card">
            <!-- Header -->
            <div class="chat-header">
                <img src="https://ssit.edu.in/img/sri-siddhartha-institute-of-technology-ssit-logo.png"
                    class="bot-avatar" alt="SSIT Logo">
                <div class="bot-info">
                    <h2>SSIT ECE Bot <span class="online-dot"></span></h2>
                    <p>Ask me anything about the ECE branch</p>
                </div>
                <button type="button" id="toggleSpeech" class="action-btn mic" title="Enable Auto-Speech"
                    style="margin-left: auto;">
                    <i class="fas fa-volume-mute" id="speechIcon"></i>
                </button>
            </div>

            <!-- Category Selector -->
            <div class="category-section">
                <div class="select-wrapper">
                    <select id="categorySelect" class="category-select">
                        <option value="" disabled selected>Browse Categories (e.g. Fees, Placements)...</option>
                        <!-- Options populated via JS -->
                    </select>
                </div>
            </div>

            <!-- Sub-options Container area -->
            <div id="subOptionsContainer" class="sub-options-container" style="display: none;">
                <!-- Buttons populated via JS -->
            </div>


            <!-- Chat Messages -->
            <div id="chatBody" class="chat-body">
                <!-- Messages go here -->
                <div class="message-wrapper bot">
                    <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="msg-avatar" alt="Bot">
                    <div class="message-bubble">
                        Hello! I'm the SSIT ECE assistant. You can select a category above or type your question below.
                        <span class="msg-time bot-time">Just now</span>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Footer / Input -->
            <div class="chat-footer">
                <form id="messageArea" class="input-group">
                    <button type="button" id="startListening" class="action-btn mic" title="Voice Input">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off"
                        class="type_msg" required />
                    <button type="submit" id="send" class="action-btn" title="Send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>



    <script>
        $(document).ready(function () {
            // Speech toggle state (default off)
            let isSpeechEnabled = false;

            $("#toggleSpeech").click(function () {
                isSpeechEnabled = !isSpeechEnabled;
                const icon = $("#speechIcon");
                const btn = $(this);
                if (isSpeechEnabled) {
                    icon.removeClass("fa-volume-mute").addClass("fa-volume-up");
                    btn.attr("title", "Disable Auto-Speech");
                    btn.removeClass("mic");
                } else {
                    icon.removeClass("fa-volume-up").addClass("fa-volume-mute");
                    btn.attr("title", "Enable Auto-Speech");
                    btn.addClass("mic");
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                }
            });

            // Categories & Sub-options Data
            const categories = {
                "ECE Department": ["Overview", "Subjects", "Career", "Projects", "Overall"],
                "Fees": ["Tuition Fees", "Hostel Fees", "Transport", "Overall"],
                "Hostel": ["HMG Hostel", "Rajagruha Hostel", "Facilities", "Overall"],
                "Placements": ["Highest Package", "Top Recruiters", "Statistics", "Training", "Overall"],
                "Labs": ["VLSI Lab", "Embedded Systems Lab", "Communication Lab", "DSP Lab", "Overall"],
                "Faculty": ["Professors", "Associate Professors", "Assistant Professors", "Overall"],
                "Location": ["Address", "Map", "Transport", "Overall"],
                "Question Papers and Notes": ["1st Year", "2nd Year", "3rd Year", "4th Year"],
                "Presentations": ["Major Project", "Technical Seminar", "Overall"],
                "Manage Notes (Lecturers Only)": ["__add_notes__"]
            };

            // Populate Categories
            const categorySelect = $("#categorySelect");
            $.each(categories, function (key, value) {
                categorySelect.append($("<option></option>").attr("value", key).text(key));
            });

            // Handle Category Selection
            categorySelect.on("change", function () {
                const selectedCat = $(this).val();
                const subOptionsContainer = $("#subOptionsContainer");
                subOptionsContainer.empty();

                // ── Manage Notes teacher panel ──────────────────────────────────
                if (selectedCat === "Manage Notes (Lecturers Only)") {
                    subOptionsContainer.show();
                    var verifiedPw = null;

                    // Step 1: password
                    var step1Html = `
                        <div id="anpStep1" style="width:100%;padding:4px 0;">
                            <div class="anp-row">
                                <input type="password" id="anpPassword" placeholder="Lecturer password..." autocomplete="off">
                                <button class="anp-submit" id="anpVerifyBtn">Unlock</button>
                            </div>
                            <div class="anp-footer"><span class="anp-msg" id="anpPwMsg"></span></div>
                        </div>`;

                    // Step 2: choose action
                    var step2Html = `
                        <div id="anpStep2" style="width:100%;padding:4px 0;display:none;">
                            <div class="anp-row">
                                <button class="anp-submit" id="anpChooseAdd" style="flex:1;">&#43; Add Note</button>
                                <button class="anp-submit" id="anpChooseDel" style="flex:1;">&#128465; Delete Note</button>
                            </div>
                        </div>`;

                    // Step 3a: Add form
                    var step3AddHtml = `
                        <div id="anpStep3Add" style="width:100%;padding:4px 0;display:none;">
                            <div style="margin-bottom:8px;">
                                <button id="anpBackFromAdd" style="background:none;border:none;color:#a78bfa;font-size:0.82rem;cursor:pointer;padding:0;font-family:inherit;">&#8592; Back to options</button>
                            </div>
                            <div class="anp-row">
                                <select id="anpYear">
                                    <option value="">-- Select Year --</option>
                                    <option value="1st year">1st Year</option>
                                    <option value="2nd year">2nd Year</option>
                                    <option value="3rd year">3rd Year</option>
                                    <option value="4th year">4th Year</option>
                                </select>
                                <input type="text" id="anpSubject" placeholder="Subject name...">
                            </div>
                            <div class="anp-row">
                                <input type="file" id="anpFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt" style="color:#94a3b8;cursor:pointer;">
                            </div>
                            <div class="anp-row" style="margin-top:0;">
                                <textarea id="anpContent" placeholder="OR paste a text note / link (optional if file selected)"></textarea>
                            </div>
                            <div class="anp-footer">
                                <button class="anp-submit" id="anpSubmitBtn">Upload &amp; Add Note</button>
                                <span class="anp-msg" id="anpFormMsg"></span>
                            </div>
                        </div>`;

                    // Step 3b: Delete panel
                    var step3DelHtml = `
                        <div id="anpStep3Del" style="width:100%;padding:4px 0;display:none;">
                            <div style="margin-bottom:8px;">
                                <button id="anpBackFromDel" style="background:none;border:none;color:#a78bfa;font-size:0.82rem;cursor:pointer;padding:0;font-family:inherit;">&#8592; Back to options</button>
                            </div>
                            <div class="anp-row">
                                <select id="anpDelYear">
                                    <option value="">-- Select Year --</option>
                                    <option value="1st year">1st Year</option>
                                    <option value="2nd year">2nd Year</option>
                                    <option value="3rd year">3rd Year</option>
                                    <option value="4th year">4th Year</option>
                                </select>
                                <button class="anp-submit" id="anpLoadNotes">Load Notes</button>
                            </div>
                            <div id="anpNotesList" style="width:100%;margin-top:6px;"></div>
                            <div class="anp-footer"><span class="anp-msg" id="anpDelMsg"></span></div>
                        </div>`;

                    subOptionsContainer.html(step1Html + step2Html + step3AddHtml + step3DelHtml);

                    // ── Password verify
                    $("#anpPassword").on("keydown", function(e) {
                        if (e.key === "Enter") $("#anpVerifyBtn").trigger("click");
                    });
                    $("#anpVerifyBtn").on("click", function() {
                        var pw  = $("#anpPassword").val().trim();
                        var msg = $("#anpPwMsg");
                        if (!pw) { msg.text("Enter password.").attr("class","anp-msg err"); return; }
                        fetch("/add_note", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({ password: pw, year: "", subject: "", content: "" })
                        }).then(r => r.json()).then(function(data) {
                            if (data.success || (data.error && data.error.indexOf("password") === -1)) {
                                verifiedPw = pw;
                                $("#anpStep1").hide();
                                $("#anpStep2").show();
                            } else {
                                msg.text(data.error || "Wrong password.").attr("class","anp-msg err");
                            }
                        }).catch(function() { msg.text("Server not reachable.").attr("class","anp-msg err"); });
                    });

                    // ── Choose Add
                    $(document).on("click", "#anpChooseAdd", function() {
                        $("#anpStep2").hide();
                        $("#anpStep3Add").show();
                    });

                    // ── Choose Delete
                    $(document).on("click", "#anpChooseDel", function() {
                        $("#anpStep2").hide();
                        $("#anpStep3Del").show();
                    });

                    // ── Back buttons (return to Add/Delete choice without re-entering password)
                    $(document).on("click", "#anpBackFromAdd", function() {
                        $("#anpStep3Add").hide();
                        $("#anpStep2").show();
                    });
                    $(document).on("click", "#anpBackFromDel", function() {
                        $("#anpStep3Del").hide();
                        $("#anpNotesList").empty();
                        $("#anpDelMsg").text("").attr("class","anp-msg");
                        $("#anpStep2").show();
                    });

                    // ── Submit Add Note (file upload via FormData)
                    $(document).on("click", "#anpSubmitBtn", function() {
                        var year    = $("#anpYear").val().trim();
                        var subject = $("#anpSubject").val().trim();
                        var content = $("#anpContent").val().trim();
                        var fileEl  = document.getElementById("anpFile");
                        var file    = fileEl && fileEl.files[0];
                        var msg     = $("#anpFormMsg");
                        if (!year)    { msg.text("Select a year.").attr("class","anp-msg err"); return; }
                        if (!subject) { msg.text("Enter subject name.").attr("class","anp-msg err"); return; }
                        if (!file && !content) { msg.text("Upload a file OR enter text/link.").attr("class","anp-msg err"); return; }
                        var btn = $("#anpSubmitBtn");
                        btn.text("Uploading...").prop("disabled", true);
                        var fd = new FormData();
                        fd.append("password", verifiedPw);
                        fd.append("year",     year);
                        fd.append("subject",  subject);
                        if (content) fd.append("content", content);
                        if (file)    fd.append("file",    file);
                        fetch("/add_note", { method: "POST", body: fd })
                        .then(r => r.json()).then(function(data) {
                            btn.text("Upload & Add Note").prop("disabled", false);
                            if (data.success) {
                                msg.text("\u2705 " + data.message).attr("class","anp-msg ok");
                                $("#anpSubject, #anpContent, #anpYear").val("");
                                if (fileEl) fileEl.value = "";
                            } else {
                                msg.text(data.error || "Failed.").attr("class","anp-msg err");
                            }
                        }).catch(function() {
                            btn.text("Upload & Add Note").prop("disabled", false);
                            msg.text("Server error.").attr("class","anp-msg err");
                        });
                    });

                    // ── Load notes for delete
                    $(document).on("click", "#anpLoadNotes", function() {
                        var year = $("#anpDelYear").val().trim();
                        var msg  = $("#anpDelMsg");
                        if (!year) { msg.text("Select a year first.").attr("class","anp-msg err"); return; }
                        fetch("/get_notes", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({ password: verifiedPw, year: year })
                        }).then(r => r.json()).then(function(data) {
                            msg.text("").attr("class","anp-msg");
                            var list = $("#anpNotesList");
                            list.empty();
                            if (!data.success) { msg.text(data.error).attr("class","anp-msg err"); return; }
                            if (data.notes.length === 0) {
                                list.html('<p style="color:#64748b;font-size:0.85rem;">No added notes found for this year.</p>');
                                return;
                            }
                            data.notes.forEach(function(note, idx) {
                                var label = note.subject + (note.added_on ? ' (' + note.added_on + ')' : '');
                                var row = $('<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"></div>');
                                row.append($('<span style="flex:1;font-size:0.85rem;color:#f1f5f9;"></span>').text(label));
                                var delBtn = $('<button class="anp-submit" style="padding:6px 12px;font-size:0.8rem;">Delete</button>');
                                delBtn.on("click", function() {
                                    if (!confirm('Delete "' + note.subject + '"? This cannot be undone.')) return;
                                    fetch("/delete_note", {
                                        method: "POST",
                                        headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({ password: verifiedPw, year: year, index: idx })
                                    }).then(r => r.json()).then(function(d) {
                                        if (d.success) {
                                            row.remove();
                                            msg.text("Deleted successfully.").attr("class","anp-msg ok");
                                        } else {
                                            msg.text(d.error || "Failed.").attr("class","anp-msg err");
                                        }
                                    });
                                });
                                row.append(delBtn);
                                list.append(row);
                            });
                        }).catch(function() { $("#anpDelMsg").text("Server error.").attr("class","anp-msg err"); });
                    });

                    return;
                }
                // ── Normal categories ────────────────────────────────────────
                if (selectedCat && categories[selectedCat]) {
                    subOptionsContainer.show();
                    categories[selectedCat].forEach(function (subOpt) {
                        const btn = $("<button></button>")
                            .addClass("sub-option-btn")
                            .text(subOpt)
                            .on("click", function () {
                                const comboMessage = selectedCat + " - " + subOpt;
                                processMessage(comboMessage);
                            });
                        subOptionsContainer.append(btn);
                    });
                } else {
                    subOptionsContainer.hide();
                }
            });

            // Initialize bot default time
            const initialDate = new Date();
            $(".bot-time").text(initialDate.getHours() + ":" + (initialDate.getMinutes() < 10 ? '0' : '') + initialDate.getMinutes());

            // Process user message
            function processMessage(msgText) {
                if (!msgText.trim()) return;

                // 1. When a new message is sent or received, any ongoing speech must STOP immediately.
                // 2. When switching to a new chat, all previous speech queues must be cleared.
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }

                const date = new Date();
                const hour = date.getHours();
                const minute = date.getMinutes() < 10 ? '0' + date.getMinutes() : date.getMinutes();
                const str_time = hour + ":" + minute;

                // Render User Message
                const userHtml = `
                <div class="message-wrapper user">
                    <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="msg-avatar" alt="User">
                    <div class="message-bubble">
                        ${msgText}
                        <span class="msg-time">${str_time}</span>
                    </div>
                </div>
            `;

                $("#text").val("");
                // Append before typing indicator
                $(userHtml).insertBefore("#typingIndicator");
                scrollToBottom();

                // Show typing indicator
                $("#typingIndicator").css("display", "flex");
                scrollToBottom();

                // Send to Bot
                $.ajax({
                    data: { msg: msgText },
                    type: "POST",
                    url: "/get",
                }).done(function (response) {
                    // Hide typing indicator
                    $("#typingIndicator").hide();

                    // Render Bot Message
                    const botHtml = `
                    <div class="message-wrapper bot">
                        <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="msg-avatar" alt="Bot">
                        <div class="message-bubble">
                            ${response.response_text}
                            <span class="msg-time">${str_time}</span>
                        </div>
                    </div>
                `;
                    $(botHtml).insertBefore("#typingIndicator");
                    scrollToBottom();

                    // Text to Speech
                    if ('speechSynthesis' in window && isSpeechEnabled) {
                        // 3. Only the latest message should be spoken.
                        // 4. Prevent overlapping or delayed speech.
                        window.speechSynthesis.cancel();
                        var speech = new SpeechSynthesisUtterance(response.response_text);
                        window.speechSynthesis.speak(speech);
                    }
                }).fail(function (jqXHR, textStatus, errorThrown) {
                    $("#typingIndicator").hide();
                    console.error("Error:", textStatus, errorThrown);
                    const errorHtml = `
                    <div class="message-wrapper bot">
                        <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="msg-avatar" alt="Bot">
                        <div class="message-bubble" style="color:#ef4444;">
                            Sorry, I couldn't connect to the server right now.
                            <span class="msg-time">${str_time}</span>
                        </div>
                    </div>
                `;
                    $(errorHtml).insertBefore("#typingIndicator");
                    scrollToBottom();
                });
            }

            function scrollToBottom() {
                const chatBody = $("#chatBody");
                chatBody.scrollTop(chatBody[0].scrollHeight);
            }

            // Form Submission
            $("#messageArea").on("submit", function (event) {
                event.preventDefault();
                const rawText = $("#text").val();
                processMessage(rawText);
            });

            // Speech Recognition
            $("#startListening").click(function () {
                if ('webkitSpeechRecognition' in window) {
                    // Stop speech if user wants to speak a new query
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                    const recognition = new webkitSpeechRecognition();
                    recognition.lang = 'en-US';

                    // Visual feedback while speaking
                    $(this).css('background', '#ef4444');
                    $(this).css('color', '#fff');

                    recognition.start();

                    recognition.onresult = function (event) {
                        // Reset styling
                        $("#startListening").css('background', '');
                        $("#startListening").css('color', '');

                        const speechToText = event.results[0][0].transcript;
                        $("#text").val(speechToText);
                        processMessage(speechToText);
                        recognition.stop();
                    }

                    recognition.onerror = function () {
                        $("#startListening").css('background', '');
                        $("#startListening").css('color', '');
                    }
                    recognition.onend = function () {
                        $("#startListening").css('background', '');
                        $("#startListening").css('color', '');
                    }
                } else {
                    alert("Speech recognition is not supported in this browser.");
                }
            });
        });

        // Global search filter for dynamically generated notes lists
        window.filterNotes = function(inputElement, listId) {
            let filter = inputElement.value.toUpperCase();
            let container = document.getElementById(listId);
            if (!container) return;
            
            let items = container.querySelectorAll(".notes-list li");
            items.forEach(function(item) {
                let text = item.textContent || item.innerText;
                if (text.toUpperCase().indexOf(filter) > -1) {
                    item.style.display = "";
                } else {
                    item.style.display = "none";
                }
            });

            // Hide headers if all children are hidden
            let sections = container.querySelectorAll(".subject-section");
            sections.forEach(function(section) {
                let visibleLinks = section.querySelectorAll("li:not([style*='display: none'])");
                if (visibleLinks.length === 0) {
                    section.style.display = "none";
                } else {
                    section.style.display = "block";
                }
            });
        };

        // ─── Add Notes Inline Panel Logic ────────────────────────────────────
        (function() {
            var verifiedPw = null;

            // Toggle panel open when "Presentations" sub-option area is visible
            // Panel is always visible below subOptionsContainer; open it via category select change
            // Actually: show panel whenever category section is shown
            // We open it permanently so teacher can always scroll down to it
            document.getElementById('addNotesPanel').classList.add('open');

            // Password verify
            function setMsg(el, text, cls) { el.textContent = text; el.className = 'anp-msg ' + cls; }

            document.getElementById('anpPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('anpVerifyBtn').click();
            });

            document.getElementById('anpVerifyBtn').addEventListener('click', function() {
                var pw  = document.getElementById('anpPassword').value.trim();
                var msg = document.getElementById('anpPwMsg');
                if (!pw) { setMsg(msg, 'Enter password.', 'err'); return; }
                fetch('/add_note', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password: pw, year: '', subject: '', content: '' })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success || (data.error && data.error.indexOf('password') === -1)) {
                        verifiedPw = pw;
                        document.getElementById('anpStep1').style.display = 'none';
                        document.getElementById('anpStep2').style.display = 'block';
                    } else {
                        setMsg(msg, data.error || 'Wrong password.', 'err');
                    }
                })
                .catch(function() { setMsg(msg, 'Server not reachable.', 'err'); });
            });

            // Submit note
            document.getElementById('anpSubmitBtn').addEventListener('click', function() {
                var year    = document.getElementById('anpYear').value.trim();
                var subject = document.getElementById('anpSubject').value.trim();
                var content = document.getElementById('anpContent').value.trim();
                var msg     = document.getElementById('anpFormMsg');
                if (!year)    { setMsg(msg, 'Select a year.', 'err'); return; }
                if (!subject) { setMsg(msg, 'Enter subject name.', 'err'); return; }
                if (!content) { setMsg(msg, 'Enter content or link.', 'err'); return; }
                var btn = document.getElementById('anpSubmitBtn');
                btn.textContent = 'Saving...';
                btn.disabled = true;
                fetch('/add_note', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password: verifiedPw, year: year, subject: subject, content: content })
                })
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    btn.textContent = 'Add Note';
                    btn.disabled = false;
                    if (data.success) {
                        setMsg(msg, 'Saved! Note added to ' + year + '.', 'ok');
                        document.getElementById('anpSubject').value = '';
                        document.getElementById('anpContent').value = '';
                        document.getElementById('anpYear').value = '';
                    } else {
                        setMsg(msg, data.error || 'Failed.', 'err');
                    }
                })
                .catch(function() {
                    btn.textContent = 'Add Note'; btn.disabled = false;
                    setMsg(msg, 'Server error.', 'err');
                });
            });
        })();
    </script>
</body>

</html>
